name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pytest:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - name: Install
        run: python -m pip install -e ".[aws,dev]"
      - name: Test
        # no AWS credentials here, so the live Textract and Nova tests skip
        env:
          AWS_DEFAULT_REGION: us-east-1
        run: python -m pytest -q
